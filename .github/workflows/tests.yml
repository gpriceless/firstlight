name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # The tile validation tests drive a headless browser.
      - run: playwright install --with-deps chromium-headless-shell
      # Docker-marked tests build images and start the compose stack; the
      # default options in pyproject.toml leave them out.
      - run: python -m pytest --import-mode=importlib
